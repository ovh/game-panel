name: game-panel-images-build

on:
  push:
    branches: ['**']
    tags: ['v*']

repository:
  vcs: stash_ovh_net
  name: squad-game/game-panel

integrations:
  - artifactory-squad-game-cicd

jobs:
  build-app:
    runs-on: library/default-vm

    steps:
      - id: checkout
        uses: actions/checkout

      - id: debug-trigger
        run: |-
          #!/bin/bash
          set -euo pipefail

          echo "=== Trigger context ==="
          echo "cds.event_name=${{ cds.event_name }}"
          echo "cds.run_number=${{ cds.run_number }}"
          echo "cds.version=${{ cds.version }}"
          echo "git.ref=${{ git.ref }}"
          echo "git.ref_name=${{ git.ref_name }}"
          echo "git.ref_type=${{ git.ref_type }}"
          echo "git.tag=${{ git.tag }}"
          echo "git.pullrequest_id=${{ git.pullrequest_id }}"

          echo "=== Changesets ==="
          echo 'git.changesets=${{ toJSON(git.changesets) }}'

          echo "=== build-images triggers ==="
          echo "docker-images/** = ${{ contains(git.changesets, 'docker-images/**') }}"
          echo "deploy/lib/**    = ${{ contains(git.changesets, 'deploy/lib/**') }}"
          echo ".cds/**          = ${{ contains(git.changesets, '.cds/**') }}"

      - id: build-backend
        run: |-
          #!/bin/bash
          set -euo pipefail

          docker build \
            --platform linux/amd64 \
            --target build \
            -f backend/Dockerfile \
            -t game-panel/backend-build-check:${{ git.sha_short }} \
            .

      - id: build-frontend
        run: |-
          #!/bin/bash
          set -euo pipefail

          docker build \
            --platform linux/amd64 \
            --target build \
            --build-arg VITE_DB_API_BASE_URL=https://example.invalid \
            -f frontend/Dockerfile \
            -t game-panel/frontend-build-check:${{ git.sha_short }} \
            .

  build-images:
    needs:
      - build-app
    if: "${{ git.ref_type == 'tag' || cds.event_name == 'manual' || contains(git.changesets, 'docker-images/**') || contains(git.changesets, 'deploy/lib/**') || contains(git.changesets, '.cds/**') }}"
    runs-on: library/default-vm

    steps:
      - id: checkout
        uses: actions/checkout

      - id: docker-version
        run: |-
          #!/bin/bash
          set -euo pipefail

          docker version

      - id: compute-version
        run: |-
          #!/bin/bash
          set -euo pipefail

          echo "cds.event_name=${{ cds.event_name }}"
          echo "git.ref=${{ git.ref }}"
          echo "git.ref_name=${{ git.ref_name }}"
          echo "git.ref_type=${{ git.ref_type }}"
          echo "git.sha=${{ git.sha }}"

          if [ "${{ git.ref_type }}" = "tag" ]; then
            IMAGE_VERSION="${{ cds.version }}"
          else
            SANITIZED="$(printf '%s' "${{ git.ref_name }}" | tr '/' '-' | tr -cd 'a-zA-Z0-9._-' | cut -c1-100)"
            IMAGE_VERSION="dev-${SANITIZED}"
          fi

          echo "IMAGE_VERSION=${IMAGE_VERSION}"
          worker export IMAGE_VERSION "${IMAGE_VERSION}"

      - id: build-images
        run: |-
          #!/bin/bash
          set -euo pipefail

          IMAGE_NAMESPACE="game-panel"

          IMAGE_CREATED="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          IMAGE_VERSION="${{ steps.compute-version.outputs.IMAGE_VERSION }}"
          IMAGE_REVISION="${{ git.sha }}"
          IMAGE_SOURCE="${{ git.repository_web_url }}"

          echo "IMAGE_NAMESPACE=${IMAGE_NAMESPACE}"
          echo "IMAGE_VERSION=${IMAGE_VERSION}"
          echo "IMAGE_CREATED=${IMAGE_CREATED}"
          echo "IMAGE_REVISION=${IMAGE_REVISION}"
          echo "IMAGE_SOURCE=${IMAGE_SOURCE}"

          if [ -z "${IMAGE_VERSION}" ]; then
            echo "ERROR: IMAGE_VERSION is empty - the compute-version step output did not resolve." >&2
            exit 1
          fi

          build_image() {
            local image="$1"
            local context="$2"
            local dockerfile="$3"
            shift 3

            echo "========================================"
            echo "Building image: ${IMAGE_NAMESPACE}/${image}:${IMAGE_VERSION}"
            echo "Context: ${context}"
            echo "Dockerfile: ${dockerfile}"
            echo "Extra args: $*"
            echo "========================================"

            docker build \
              --platform linux/amd64 \
              --build-arg IMAGE_CREATED="${IMAGE_CREATED}" \
              --build-arg IMAGE_REVISION="${IMAGE_REVISION}" \
              --build-arg IMAGE_VERSION="${IMAGE_VERSION}" \
              --build-arg IMAGE_SOURCE="${IMAGE_SOURCE}" \
              "$@" \
              -f "${dockerfile}" \
              -t "${IMAGE_NAMESPACE}/${image}:${IMAGE_VERSION}" \
              "${context}"
          }

          # ----- Minecraft -----

          build_image \
            "gamepanel-minecraft-java-edition-java25" \
            "docker-images/minecraft/java-edition" \
            "docker-images/minecraft/java-edition/vanilla/Dockerfile" \
            --build-arg JAVA_VERSION=25

          build_image \
            "gamepanel-minecraft-java-edition-java21" \
            "docker-images/minecraft/java-edition" \
            "docker-images/minecraft/java-edition/vanilla/Dockerfile" \
            --build-arg JAVA_VERSION=21

          build_image \
            "gamepanel-minecraft-java-edition-java17" \
            "docker-images/minecraft/java-edition" \
            "docker-images/minecraft/java-edition/vanilla/Dockerfile" \
            --build-arg JAVA_VERSION=17

          build_image \
            "gamepanel-minecraft-java-edition-java8" \
            "docker-images/minecraft/java-edition" \
            "docker-images/minecraft/java-edition/vanilla/Dockerfile" \
            --build-arg JAVA_VERSION=8

          build_image \
            "gamepanel-minecraft-paper-java25" \
            "docker-images/minecraft/java-edition" \
            "docker-images/minecraft/java-edition/paper/Dockerfile" \
            --build-arg JAVA_VERSION=25

          build_image \
            "gamepanel-minecraft-paper-java21" \
            "docker-images/minecraft/java-edition" \
            "docker-images/minecraft/java-edition/paper/Dockerfile" \
            --build-arg JAVA_VERSION=21

          build_image \
            "gamepanel-minecraft-paper-java17" \
            "docker-images/minecraft/java-edition" \
            "docker-images/minecraft/java-edition/paper/Dockerfile" \
            --build-arg JAVA_VERSION=17

          build_image \
            "gamepanel-minecraft-paper-java8" \
            "docker-images/minecraft/java-edition" \
            "docker-images/minecraft/java-edition/paper/Dockerfile" \
            --build-arg JAVA_VERSION=8

          build_image \
            "gamepanel-minecraft-fabric-java25" \
            "docker-images/minecraft/java-edition" \
            "docker-images/minecraft/java-edition/fabric/Dockerfile" \
            --build-arg JAVA_VERSION=25

          build_image \
            "gamepanel-minecraft-fabric-java21" \
            "docker-images/minecraft/java-edition" \
            "docker-images/minecraft/java-edition/fabric/Dockerfile" \
            --build-arg JAVA_VERSION=21

          build_image \
            "gamepanel-minecraft-fabric-java17" \
            "docker-images/minecraft/java-edition" \
            "docker-images/minecraft/java-edition/fabric/Dockerfile" \
            --build-arg JAVA_VERSION=17

          build_image \
            "gamepanel-minecraft-fabric-java8" \
            "docker-images/minecraft/java-edition" \
            "docker-images/minecraft/java-edition/fabric/Dockerfile" \
            --build-arg JAVA_VERSION=8

          build_image \
            "gamepanel-minecraft-neoforge-java25" \
            "docker-images/minecraft/java-edition" \
            "docker-images/minecraft/java-edition/neoforge/Dockerfile" \
            --build-arg JAVA_VERSION=25

          build_image \
            "gamepanel-minecraft-neoforge-java21" \
            "docker-images/minecraft/java-edition" \
            "docker-images/minecraft/java-edition/neoforge/Dockerfile" \
            --build-arg JAVA_VERSION=21

          build_image \
            "gamepanel-minecraft-neoforge-java17" \
            "docker-images/minecraft/java-edition" \
            "docker-images/minecraft/java-edition/neoforge/Dockerfile" \
            --build-arg JAVA_VERSION=17

          build_image \
            "gamepanel-minecraft-neoforge-java8" \
            "docker-images/minecraft/java-edition" \
            "docker-images/minecraft/java-edition/neoforge/Dockerfile" \
            --build-arg JAVA_VERSION=8

          build_image \
            "gamepanel-minecraft-forge-java25" \
            "docker-images/minecraft/java-edition" \
            "docker-images/minecraft/java-edition/forge/Dockerfile" \
            --build-arg JAVA_VERSION=25

          build_image \
            "gamepanel-minecraft-forge-java21" \
            "docker-images/minecraft/java-edition" \
            "docker-images/minecraft/java-edition/forge/Dockerfile" \
            --build-arg JAVA_VERSION=21

          build_image \
            "gamepanel-minecraft-forge-java17" \
            "docker-images/minecraft/java-edition" \
            "docker-images/minecraft/java-edition/forge/Dockerfile" \
            --build-arg JAVA_VERSION=17

          build_image \
            "gamepanel-minecraft-forge-java8" \
            "docker-images/minecraft/java-edition" \
            "docker-images/minecraft/java-edition/forge/Dockerfile" \
            --build-arg JAVA_VERSION=8

          build_image \
            "gamepanel-minecraft-bedrock-edition" \
            "docker-images/minecraft/bedrock-edition" \
            "docker-images/minecraft/bedrock-edition/Dockerfile"

          # ----- Other games -----

          build_image \
            "gamepanel-counter-strike-2" \
            "docker-images/counter-strike/2" \
            "docker-images/counter-strike/2/Dockerfile"

          build_image \
            "gamepanel-garrys-mod" \
            "docker-images/garrys-mod" \
            "docker-images/garrys-mod/Dockerfile"

          build_image \
            "gamepanel-hytale-java25" \
            "docker-images/hytale" \
            "docker-images/hytale/Dockerfile"

          build_image \
            "gamepanel-palworld" \
            "docker-images/palworld" \
            "docker-images/palworld/Dockerfile"

          build_image \
            "gamepanel-project-zomboid" \
            "docker-images/project-zomboid" \
            "docker-images/project-zomboid/Dockerfile"

          build_image \
            "gamepanel-rust" \
            "docker-images/rust" \
            "docker-images/rust/Dockerfile"

          build_image \
            "gamepanel-valheim" \
            "docker-images/valheim" \
            "docker-images/valheim/Dockerfile"

          # ----- Operational images -----

          build_image \
            "gamepanel-updater" \
            "." \
            "docker-images/gamepanel/updater/Dockerfile"

      # ----- Minecraft -----

      - id: push-gamepanel-minecraft-java-edition-java25
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-minecraft-java-edition-java25:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      - id: push-gamepanel-minecraft-java-edition-java21
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-minecraft-java-edition-java21:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      - id: push-gamepanel-minecraft-java-edition-java17
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-minecraft-java-edition-java17:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      - id: push-gamepanel-minecraft-java-edition-java8
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-minecraft-java-edition-java8:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      - id: push-gamepanel-minecraft-paper-java25
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-minecraft-paper-java25:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      - id: push-gamepanel-minecraft-paper-java21
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-minecraft-paper-java21:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      - id: push-gamepanel-minecraft-paper-java17
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-minecraft-paper-java17:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      - id: push-gamepanel-minecraft-paper-java8
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-minecraft-paper-java8:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      - id: push-gamepanel-minecraft-fabric-java25
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-minecraft-fabric-java25:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      - id: push-gamepanel-minecraft-fabric-java21
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-minecraft-fabric-java21:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      - id: push-gamepanel-minecraft-fabric-java17
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-minecraft-fabric-java17:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      - id: push-gamepanel-minecraft-fabric-java8
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-minecraft-fabric-java8:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      - id: push-gamepanel-minecraft-neoforge-java25
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-minecraft-neoforge-java25:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      - id: push-gamepanel-minecraft-neoforge-java21
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-minecraft-neoforge-java21:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      - id: push-gamepanel-minecraft-neoforge-java17
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-minecraft-neoforge-java17:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      - id: push-gamepanel-minecraft-neoforge-java8
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-minecraft-neoforge-java8:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      - id: push-gamepanel-minecraft-forge-java25
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-minecraft-forge-java25:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      - id: push-gamepanel-minecraft-forge-java21
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-minecraft-forge-java21:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      - id: push-gamepanel-minecraft-forge-java17
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-minecraft-forge-java17:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      - id: push-gamepanel-minecraft-forge-java8
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-minecraft-forge-java8:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      - id: push-gamepanel-minecraft-bedrock-edition
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-minecraft-bedrock-edition:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      # ----- Other games -----

      - id: push-gamepanel-counter-strike-2
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-counter-strike-2:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      - id: push-gamepanel-garrys-mod
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-garrys-mod:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      - id: push-gamepanel-hytale-java25
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-hytale-java25:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      - id: push-gamepanel-palworld
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-palworld:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      - id: push-gamepanel-project-zomboid
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-project-zomboid:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      - id: push-gamepanel-rust
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-rust:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      - id: push-gamepanel-valheim
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-valheim:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

      # ----- Operational images -----

      - id: push-gamepanel-updater
        uses: actions/dockerPush
        with:
          image: game-panel/gamepanel-updater:${{ steps.compute-version.outputs.IMAGE_VERSION }}
          tags: "${{ steps.compute-version.outputs.IMAGE_VERSION }}"

  release-artifactory:
    needs:
      - build-images
    if: "${{ git.ref_type == 'tag' && success() }}"
    runs-on:
      model: library/default-container

    steps:
      - id: release-artifactory
        uses: actions/artifactoryRelease
        with:
          artifacts: "**"
          releaseNotes: "Game Panel images ${{ cds.version }}"
        integrations:
          - artifactory-squad-game-cicd
